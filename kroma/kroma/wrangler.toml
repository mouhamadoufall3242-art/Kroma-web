# =============================================================================
# KROMA — Cloudflare Worker
# -----------------------------------------------------------------------------
# Un solo Worker serve sia il sito statico (cartella public/) sia le API.
# Deploy:  npx wrangler deploy
# Locale:  npx wrangler dev
# =============================================================================

name = "kroma"
main = "src/index.js"
compatibility_date = "2026-09-06"

# -----------------------------------------------------------------------------
# Sito statico
# -----------------------------------------------------------------------------
# Le richieste che corrispondono a un file dentro public/ vengono servite
# direttamente, senza far partire il Worker (e senza consumare invocazioni).
# Tutto il resto — quindi /api/* — arriva al Worker.
#
# NON impostare not_found_handling = "single-page-application": servirebbe
# index.html anche alle chiamate API, e il front-end riceverebbe HTML al posto
# del JSON. Il default ("none") è quello giusto qui.
#
# Se un giorno pubblicherai il front-end separatamente (Cloudflare Pages), è
# questo il blocco da togliere: il Worker resterebbe solo API. Ma finché sta
# qui, sito e API vivono sulla stessa origine — niente CORS, niente URL
# assolute nel front-end, un solo deploy. Vedi la sezione "Pubblicazione" del
# README prima di cambiare.
[assets]
directory = "./public"

# -----------------------------------------------------------------------------
# KV — anteprime generate
# -----------------------------------------------------------------------------
# Crea i namespace una volta sola, poi incolla qui gli id che il comando stampa:
#   npx wrangler kv namespace create PREVIEWS
#   npx wrangler kv namespace create PREVIEWS --preview
[[kv_namespaces]]
binding = "PREVIEWS"
id = "INSERISCI_QUI_L_ID_DEL_NAMESPACE"
preview_id = "INSERISCI_QUI_L_ID_DI_ANTEPRIMA"

# -----------------------------------------------------------------------------
# Variabili pubbliche (finiscono nel bundle: niente segreti qui dentro)
# -----------------------------------------------------------------------------
[vars]
SITE_URL = "https://kroma.it"
EMAIL_FROM = "Kroma <anteprime@kroma.it>"
EMAIL_REPLY_TO = "kroma.site@gmail.com"

# Verifica l'identificativo aggiornato del modello su:
# https://docs.claude.com/en/docs/about-claude/models
ANTHROPIC_MODEL = "claude-sonnet-4-5"

# Durata di conservazione delle anteprime in KV, in giorni.
PREVIEW_TTL_DAYS = "90"

# Tetto di richieste per IP all'ora (l'endpoint costa soldi a ogni chiamata).
RATE_LIMIT_PER_HOUR = "5"

# Id dei prezzi creati nel pannello Stripe. Non sono segreti: identificano un
# listino, non autorizzano nulla. Gli IMPORTI però stanno in src/lib/stripe.js
# e non arrivano mai dal browser.
#   codice        290 €  una tantum
#   abbonamento    29 €  al mese
#   attivazione    90 €  una tantum, sulla prima fattura dell'abbonamento
STRIPE_PRICE_CODICE = "price_INSERISCI_QUI"
STRIPE_PRICE_ABBONAMENTO = "price_INSERISCI_QUI"
STRIPE_PRICE_ATTIVAZIONE = "price_INSERISCI_QUI"

# -----------------------------------------------------------------------------
# SEGRETI — non vanno MAI scritti in questo file, che finisce su git.
# -----------------------------------------------------------------------------
# Impostali una volta sola dalla riga di comando:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put STRIPE_SECRET_KEY       (sk_live_… — muove denaro)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   (whsec_… — dal pannello Stripe)
#
# In locale, mettili invece in un file .dev.vars (già in .gitignore).
#
# STRIPE_WEBHOOK_SECRET non è opzionale: senza, /api/webhooks/stripe rifiuta
# ogni chiamata con 503. È voluto — un webhook di pagamento non firmato è una
# porta aperta per attivare pacchetti senza pagarli.

[observability]
enabled = true
